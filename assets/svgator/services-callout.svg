<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" preserveAspectRatio="xMidYMid meet">
<defs>
 <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#17233d"/><stop offset="1" stop-color="#f97316"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".14"/></filter>
</defs>
<!-- animated callout/product blocks -->
<g filter="url(#shadow)">
 <rect x="55" y="68" width="155" height="105" rx="20" fill="#17233d" opacity=".96">
   <animateTransform attributeName="transform" type="scale" values=".86  .86;1 1;1.03 1.03;1 1" keyTimes="0;.35;.62;1" dur="3.6s" repeatCount="indefinite" additive="sum"/>
 </rect>
 <rect x="82" y="96" width="72" height="8" rx="4" fill="#fff" opacity=".55"/>
 <rect x="82" y="116" width="98" height="7" rx="3.5" fill="#fff" opacity=".25"/>
 <rect x="82" y="138" width="54" height="7" rx="3.5" fill="#f97316" opacity=".9"/>
</g>

<g filter="url(#shadow)">
 <rect x="265" y="112" width="170" height="112" rx="20" fill="#fff" stroke="#17233d" stroke-opacity=".18" stroke-width="2">
   <animateTransform attributeName="transform" type="translate" values="30 18;0 0;-6 -4;0 0" dur="3.2s" repeatCount="indefinite"/>
 </rect>
 <rect x="294" y="140" width="105" height="8" rx="4" fill="#17233d" opacity=".2"/>
 <rect x="294" y="161" width="78" height="7" rx="3.5" fill="#17233d" opacity=".12"/>
 <rect x="294" y="184" width="112" height="9" rx="4.5" fill="url(#brand)" opacity=".9">
   <animate attributeName="width" values="50;112;85;112" dur="2.8s" repeatCount="indefinite"/>
 </rect>
</g>

<!-- connector line draws between blocks -->
<path d="M205 120 C235 92 247 92 278 133" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100">
 <animate attributeName="stroke-dashoffset" from="100" to="0" dur=".8s" begin=".25s" repeatCount="indefinite"/>
</path>

<!-- zoom/callout ring -->
<circle cx="385" cy="95" r="30" fill="none" stroke="#f97316" stroke-width="3" opacity=".75">
 <animate attributeName="r" values="22;42;22" dur="2.2s" repeatCount="indefinite"/>
 <animate attributeName="opacity" values=".2;.85;.2" dur="2.2s" repeatCount="indefinite"/>
</circle>
<circle cx="385" cy="95" r="7" fill="#f97316">
 <animate attributeName="r" values="5;9;5" dur="1.1s" repeatCount="indefinite"/>
</circle>
</svg>